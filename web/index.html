<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendência Projetista</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 16px; }
    header { background: #1f6feb; color: white; padding: 20px; border-radius: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 6px 0 0; }
    .botao { display: block; background: #1f6feb; color: white; text-align: center; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-bottom: 16px; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .vazio { text-align: center; color: #666; padding: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>Pendência Projetista</h1>
    <p>Organize fotos, cotas e tarefas do dia</p>
  </header>
  <a class="botao" href="#">+ Nova pendência</a>
  <div class="card">
    <strong>Nenhuma pendência cadastrada</strong>
    <p>Crie sua primeira pendência com foto e cota.</p>
  </div>
</body>
</html>
